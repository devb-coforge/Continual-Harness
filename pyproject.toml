[project]
name = "continual-harness"
version = "0.1.0"
description = "Fixed-task renters benchmark and OpenRouter system-prompt optimization CLI"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["continual_harness*", "renters_benchmark*", "benchmarks*"]

[project.scripts]
continual-harness = "continual_harness.__main__:main"
